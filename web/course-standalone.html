<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C# Trainer Pro — автономная версия курса</title>
<style>:root {
  --bg: #f8fafc;
  --panel: #ffffff;
  --border: #e2e8f0;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --text: #0f172a;
  --muted: #64748b;
  --code-bg: #f1f5f9;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.25rem;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.brand { font-weight: 700; font-size: 1.1rem; }
.top-actions a { color: var(--accent); text-decoration: none; font-weight: 600; }

.layout { flex: 1; display: flex; min-height: 0; }

.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 1rem 0.75rem;
}

.sidebar-title {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  padding: 0 0.5rem 0.5rem;
}

#menu { display: flex; flex-direction: column; gap: 2px; }

#menu button {
  text-align: left;
  border: 0;
  background: transparent;
  padding: 0.5rem 0.75rem;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text);
  font-size: 0.9rem;
}

#menu button:hover { background: var(--bg); }
#menu button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.main { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }

.placeholder {
  color: var(--muted);
  font-size: 1.1rem;
  text-align: center;
  margin-top: 20vh;
}

/* Вкладки */
.tabs { display: flex; gap: 0.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }

.tabs button {
  border: 0;
  background: transparent;
  padding: 0.55rem 1rem;
  cursor: pointer;
  font-size: 0.95rem;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}

.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.content { max-width: 820px; }
.content h1 { font-size: 1.6rem; margin-top: 0; }
.content h2 { font-size: 1.25rem; margin-top: 1.6rem; }
.content h3 { font-size: 1.05rem; }
.content table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.9rem; }
.content th, .content td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
.content th { background: var(--code-bg); }
.content pre {
  background: var(--code-bg);
  padding: 0.9rem;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 0.85rem;
}
.content code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.content :not(pre) > code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
.content blockquote {
  border-left: 4px solid var(--accent-soft);
  margin: 1rem 0;
  padding: 0.25rem 1rem;
  color: var(--muted);
  background: #f0f6ff;
  border-radius: 0 8px 8px 0;
}
.content details {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.6rem 0.9rem;
  margin: 0.75rem 0;
}
.content summary { cursor: pointer; font-weight: 600; }

.nav-bottom {
  display: flex;
  justify-content: space-between;
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.nav-bottom a { color: var(--accent); text-decoration: none; font-weight: 600; }

.error-box { color: #b91c1c; background: #fee2e2; padding: 1rem; border-radius: 8px; }

<script>(function () {
  "use strict";

  var DATA = window.COURSE_DATA || {};
  var MODULES = window.COURSE_MODULES || [];
  var TABS = [
    { id: "teoria", label: "Теория" },
    { id: "praktika", label: "Практика" },
    { id: "razbor", label: "Разбор кода" }
  ];
  var state = { index: 0, tab: "teoria" };

  function $(sel) { return document.querySelector(sel); }

  function renderMenu() {
    var m = $("#menu");
    m.innerHTML = "";
    MODULES.forEach(function (x, i) {
      var b = document.createElement("button");
      b.textContent = x.title;
      b.dataset.index = i;
      b.onclick = function () { openModule(i); };
      m.appendChild(b);
    });
  }

  function updateActive() {
    var buttons = document.querySelectorAll("#menu button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("active", Number(buttons[i].dataset.index) === state.index);
    }
  }

  function renderView() {
    var mod = MODULES[state.index];
    var tab = TABS[0];
    for (var t = 0; t < TABS.length; t++) {
      if (TABS[t].id === state.tab) { tab = TABS[t]; break; }
    }
    var html = (DATA[mod.slug] || {})[tab.id] || '<div class="error-box">Материал отсутствует</div>';

    var tabsHtml = '<div class="tabs">';
    for (var i = 0; i < TABS.length; i++) {
      tabsHtml += '<button data-tab="' + TABS[i].id + '" class="' +
        (TABS[i].id === state.tab ? "active" : "") + '">' + TABS[i].label + "</button>";
    }
    tabsHtml += "</div>";

    var prev = state.index > 0
      ? '<a href="#" data-nav="' + (state.index - 1) + '">← ' + MODULES[state.index - 1].title + "</a>"
      : "<span></span>";
    var next = state.index < MODULES.length - 1
      ? '<a href="#" data-nav="' + (state.index + 1) + '">' + MODULES[state.index + 1].title + " →</a>"
      : "<span></span>";

    $("#view").innerHTML = tabsHtml +
      '<div class="content">' + html + "</div>" +
      '<div class="nav-bottom">' + prev + next + "</div>";

    if (window.hljs) {
      var codes = document.querySelectorAll("#view pre code");
      for (var c = 0; c < codes.length; c++) {
        try { hljs.highlightElement(codes[c]); } catch (e) {}
      }
    }

    var tabButtons = document.querySelectorAll("#view .tabs button");
    for (var tb = 0; tb < tabButtons.length; tb++) {
      tabButtons[tb].onclick = function () { state.tab = this.dataset.tab; renderView(); };
    }
    var navLinks = document.querySelectorAll("#view [data-nav]");
    for (var n = 0; n < navLinks.length; n++) {
      navLinks[n].onclick = function (e) { e.preventDefault(); openModule(Number(this.dataset.nav)); };
    }
  }

  function openModule(i) {
    state.index = i;
    state.tab = "teoria";
    updateActive();
    renderView();
  }

  window.openModule = openModule;

  document.addEventListener("DOMContentLoaded", function () {
    renderMenu();
    openModule(0);
  });
})();
</script>
