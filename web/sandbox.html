<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C# Песочница — реальный запуск</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: #f8fafc; color: #0f172a; }
    header { padding: .9rem 1.4rem; background: #fff; border-bottom: 1px solid #e2e8f0;
             display: flex; align-items: center; justify-content: space-between; }
    .brand { font-weight: 800; font-size: 1.15rem; }
    .hint { color: #64748b; font-size: .82rem; }
    .layout { max-width: 1040px; margin: 1.4rem auto; padding: 0 1rem;
              display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem; }
    .panel h2 { margin: 0 0 .6rem; font-size: 1rem; color: #334155; }
    textarea { width: 100%; min-height: 340px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: .9rem; padding: .7rem; border: 1px solid #cbd5e1; border-radius: 8px;
               background: #f8fafc; resize: vertical; }
    .row { display: flex; gap: .5rem; margin-top: .6rem; flex-wrap: wrap; }
    button { padding: .55rem 1.1rem; border: 0; border-radius: 8px; background: #2563eb;
             color: #fff; font-weight: 600; cursor: pointer; }
    button.ghost { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #out { width: 100%; min-height: 340px; font-family: ui-monospace, monospace; font-size: .9rem;
            padding: .7rem; border: 1px solid #cbd5e1; border-radius: 8px;
            background: #0b1120; color: #d1e7ff; white-space: pre-wrap; overflow: auto; }
    #out.err { color: #fecaca; }
    .meta { color: #64748b; font-size: .8rem; margin-top: .5rem; }
    .tpls { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }
    .tpls button { font-size: .78rem; padding: .3rem .7rem; background: #eef2ff; color: #3730a3;
                    border: 1px solid #dbeafe; }
    code.bad { color: #b91c1c; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">⌨️ C# Песочница</div>
    <div class="hint">реальный запуск · .NET SDK · локальный сервер</div>
  </header>

  <div class="layout">
    <div class="panel">
      <h2>Код</h2>
      <textarea id="code" spellcheck="false">Console.WriteLine("Привет, мир!");
Console.WriteLine("Сумма 2+3 = " + (2 + 3));</textarea>
      <div class="row">
        <button id="run">▶ Запустить</button>
        <button id="tpl1" class="tpls">цикл</button>
        <button id="tpl2" class="tpls">класс</button>
        <button id="tpl3" class="tpls">LINQ</button>
        <button id="tpl5" class="tpls">try/catch</button>
        <button id="tpl6" class="tpls">строки/массивы</button>
        <button id="tpl7" class="tpls">рекурсия</button>
      </div>
      <div class="meta">Запуск — реальная компиляция через <code>dotnet build</code> + исполнение (2–7 секунд). Примечание: <code>Console.ReadLine()</code> в песочнице не поддерживается.</div>
    </div>

    <div class="panel">
      <h2>Вывод</h2>
      <div id="out">— здесь появится результат запуска —</div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const out = $("#out"), meta = $("#meta"), code = $("#code");

    const templates = {
      tpl1: "for (int i = 1; i <= 5; i++)\n{\n    Console.WriteLine($\"Строка {i}\");\n}",
      tpl2: "var cat = new Cat(\"Мурка\");\ncat.Say();\n\nclass Cat\n{\n    private readonly string _name;\n    public Cat(string n) => _name = n;\n    public void Say() => Console.WriteLine($\"{_name}: мяу!\");\n}",
      tpl3: "var nums = new[] { 10, 3, 7, 2 };\nvar big = nums.Where(n => n > 4).OrderByDescending(n => n);\nConsole.WriteLine(string.Join(\", \", big));",
      tpl5: "try\n{\n    int x = int.Parse(\"пять\");\n    Console.WriteLine(x);\n}\ncatch (FormatException)\n{\n    Console.WriteLine(\"Это не число!\");\n}",
      tpl6: "string s = \"C# — это круто\";\nConsole.WriteLine(\"Длина: \" + s.Length);\nConsole.WriteLine(\"Верхний регистр: \" + s.ToUpper());\nvar words = s.Split(' ');\nConsole.WriteLine(\"Слов: \" + words.Length);",
      tpl7: "Console.WriteLine(Factorial(5));\n\nint Factorial(int n) => n <= 1 ? 1 : n * Factorial(n - 1);"
    };
    Object.keys(templates).forEach((id) => {
      $("#" + id).onclick = () => { code.value = templates[id]; out.textContent = "— код заменён, нажми Запустить —"; out.className = ""; meta.textContent = ""; };
    });

    async function run() {
      const btn = $("#run");
      btn.disabled = true;
      out.textContent = "Компиляция и запуск…";
      out.className = "";
      meta.textContent = "";
      try {
        const res = await fetch("/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code.value })
        });
        const data = await res.json();
        out.textContent = data.output || "(нет вывода)";
        out.className = data.error ? "err" : "";
        meta.textContent = "общее время: " + (data.ms / 1000).toFixed(2) + " с" + (data.error ? " · ошибка компиляции/запуска" : " · успешно");
      } catch (e) {
        out.textContent = "Ошибка сети: " + e.message + "\nУбедись, что сервер запущен: node web/sandbox-server.js";
        out.className = "err";
      } finally {
        btn.disabled = false;
      }
    }
    $("#run").onclick = run;
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
    });
  </script>
</body>
</html>
