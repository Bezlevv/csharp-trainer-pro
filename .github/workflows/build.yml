name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build module 13 (unit testing demo)
        run: dotnet build modules/13-unit-testing/xunit-demo/Calculator.slnx --configuration Release

      - name: Test module 13
        run: dotnet test modules/13-unit-testing/xunit-demo/Calculator.slnx --configuration Release --no-build

      - name: Build module 15 (final project)
        run: dotnet build modules/15-final-project/task-tracker/TaskTracker.slnx --configuration Release

      - name: Test module 15
        run: dotnet test modules/15-final-project/task-tracker/TaskTracker.slnx --configuration Release --no-build

      - name: Build module 17 (ASP.NET Core minimal API)
        run: dotnet build modules/17-aspnet/minimal-api-demo/TaskApi.slnx --configuration Release

      - name: Test module 17
        run: dotnet test modules/17-aspnet/minimal-api-demo/TaskApi.slnx --configuration Release --no-build

      - name: Build module 18 (EF Core demo)
        run: dotnet build modules/18-databases/efcore-demo/EfCoreDemo.slnx --configuration Release

      - name: Test module 18
        run: dotnet test modules/18-databases/efcore-demo/EfCoreDemo.slnx --configuration Release --no-build
